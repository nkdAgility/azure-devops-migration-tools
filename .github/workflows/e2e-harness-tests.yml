name: e2e harness tests

# Script tests for tools/e2e. They mock every Azure DevOps call, so they need no credential and touch no organisation.
on:
  pull_request:
    paths:
      - "tools/e2e/**"
      - ".github/workflows/e2e-harness-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Pester
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = "tools/e2e"
          $config.Run.Exit = $true
          $config.Output.Verbosity = "Detailed"
          Invoke-Pester -Configuration $config
