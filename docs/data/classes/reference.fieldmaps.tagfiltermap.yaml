optionsClassName: TagFilterMapOptions
optionsClassFullName: MigrationTools.Tools.TagFilterMapOptions
configurationSamples:
- name: defaults
  order: 2
  description: 
  code: >-
    {
      "MigrationTools": {
        "Version": "16.0",
        "CommonTools": {
          "FieldMappingTool": {
            "FieldMaps": [
              {
                "FieldMapType": "TagFilterMap",
                "ApplyTo": [
                  "*"
                ]
              }
            ]
          }
        }
      }
    }
  sampleFor: MigrationTools.Tools.TagFilterMapOptions
- name: sample
  order: 1
  description: 
  code: >-
    {
      "MigrationTools": {
        "Version": "16.0",
        "CommonTools": {
          "FieldMappingTool": {
            "FieldMaps": [
              {
                "FieldMapType": "TagFilterMap",
                "ApplyTo": [
                  "SomeWorkItemType"
                ],
                "includeTags": [
                  "Approved",
                  "Release",
                  "regex:^Team-"
                ],
                "excludeTags": [
                  "Team-Legacy"
                ]
              }
            ]
          }
        }
      }
    }
  sampleFor: MigrationTools.Tools.TagFilterMapOptions
- name: classic
  order: 3
  description: 
  code: >-
    {
      "$type": "TagFilterMapOptions",
      "includeTags": [
        "Approved",
        "Release",
        "regex:^Team-"
      ],
      "excludeTags": [
        "Team-Legacy"
      ],
      "ApplyTo": [
        "*",
        "SomeWorkItemType"
      ]
    }
  sampleFor: MigrationTools.Tools.TagFilterMapOptions
description: Keeps only the approved tags (`includeTags`) on the target work item, always drops the blocked ones (`excludeTags`), and logs each tag it drops.
className: TagFilterMap
typeName: FieldMaps
options:
- parameterName: ApplyTo
  type: List
  description: A list of Work Item Types that this Field Map will apply to. Use "*" to apply it to all Work Item Types. A field map with an empty list applies to no Work Item Types and never runs.
  defaultValue: missing XML code comments
  isRequired: false
  dotNetType: System.Collections.Generic.List`1[[System.String, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e]], System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: Enabled
  type: Boolean
  description: 'Not used: every configured field map runs for the work item types in `ApplyTo`. To turn a field map off, remove it from `FieldMaps`.'
  defaultValue: missing XML code comments
  isRequired: false
  dotNetType: System.Boolean, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: excludeTags
  type: List
  description: The blocked tags. A tag that matches one of them is always dropped, even when it also matches `includeTags`.
  defaultValue: '[]'
  isRequired: false
  dotNetType: System.Collections.Generic.List`1[[System.String, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e]], System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: includeTags
  type: List
  description: The approved tags. When it has entries, only tags that match one of them are kept. When it is empty, every tag is kept unless it matches `excludeTags`.
  defaultValue: '[]'
  isRequired: false
  dotNetType: System.Collections.Generic.List`1[[System.String, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e]], System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
