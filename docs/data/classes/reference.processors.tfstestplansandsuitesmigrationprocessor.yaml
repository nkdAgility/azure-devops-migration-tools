description: Rebuilds Test Plans and Test Suites in the target and adds the Test Cases already migrated by TfsWorkItemMigrationProcessor. Plans are matched by name and suites by title, so both must be unique. Test runs are not migrated.
className: TfsTestPlansAndSuitesMigrationProcessor
typeName: Processors
options:
- parameterName: Enabled
  type: Boolean
  description: If set to `true` then the processor will run. Set to `false` and the processor will not run.
  defaultValue: missing XML code comments
  isRequired: true
  dotNetType: System.Boolean, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: Enrichers
  type: List
  description: List of Enrichers that can be used to add more features to this processor. Only works with Native Processors and not legacy Processors.
  defaultValue: missing XML code comments
  isRequired: false
  dotNetType: System.Collections.Generic.List`1[[MigrationTools.Enrichers.IProcessorEnricherOptions, MigrationTools, Version=0.0.0.0, Culture=neutral, PublicKeyToken=null]], System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: FilterCompleted
  type: Boolean
  description: If `true`, skips each source Test Plan whose name already exists in the target, so plans migrated by an earlier run are not processed again.
  defaultValue: false
  isRequired: false
  dotNetType: System.Boolean, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: MigrationDelay
  type: Int32
  description: Milliseconds to wait before processing each Test Suite. Use it to slow the run down when the target throttles requests. `0` means no delay.
  defaultValue: 0
  isRequired: false
  dotNetType: System.Int32, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: OnlyElementsWithTag
  type: String
  description: Only plans, suites and Test Cases whose tags contain this text are migrated. The match is a substring of the tags text, so `move` also matches `remove`. A plan or suite under the root suite that does not match is skipped with everything below it. Leave it empty or unset to migrate everything.
  defaultValue: null
  isRequired: false
  dotNetType: System.String, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: RefName
  type: String
  description: '`Refname` will be used in the future to allow for using named Options without the need to copy all of the options.'
  defaultValue: missing XML code comments
  isRequired: false
  dotNetType: System.String, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: RemoveAllLinks
  type: Boolean
  description: If `true`, removes every link from each Test Plan the processor creates in the target. Plans that already exist in the target are not changed.
  defaultValue: false
  isRequired: false
  dotNetType: System.Boolean, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: RemoveInvalidTestSuiteLinks
  type: Boolean
  description: If `true`, removes links whose URI is not valid from each Test Plan the processor creates in the target, and logs each one. If `false`, such links are kept and a warning is logged, and the save can fail with "The URL specified has a potentially unsafe URL protocol". See https://github.com/nkdAgility/azure-devops-migration-tools/issues/178.
  defaultValue: false
  isRequired: false
  dotNetType: System.Boolean, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: SourceName
  type: String
  description: This is the `IEndpoint` that will be used as the source of the Migration. Can be null for a write only processor.
  defaultValue: missing XML code comments
  isRequired: true
  dotNetType: System.String, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: TargetName
  type: String
  description: This is the `IEndpoint` that will be used as the Target of the Migration. Can be null for a read only processor.
  defaultValue: missing XML code comments
  isRequired: true
  dotNetType: System.String, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: TestPlanIds
  type: Int32[]
  description: Migrates only the Test Plans with these IDs. Pass the test plan IDs as an array, for example `[123, 456, 789]`. Leave it empty to migrate every plan selected by `TestPlanQuery`.
  defaultValue: '[]'
  isRequired: false
  dotNetType: System.Int32[], System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: TestPlanQuery
  type: String
  description: 'Filtering conditions to decide whether to migrate a test plan or not. This is not WIQL: when provided, this partial query is added after `Select * From TestPlan Where` when selecting test plans. Among filtering options, `AreaPath`, `PlanName` and `PlanState` are known to work. There is unfortunately no documentation regarding the available fields. Leave it empty to select every plan.'
  defaultValue: null
  isRequired: false
  dotNetType: System.String, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
status: Beta
processingTarget: Suites &amp; Plans
