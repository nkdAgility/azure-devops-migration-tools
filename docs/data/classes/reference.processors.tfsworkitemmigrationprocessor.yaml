description: >-
  WorkItemMigrationConfig is the main processor used to Migrate Work Items, Links, and Attachments.
   Use `WorkItemMigrationConfig` to configure.
className: TfsWorkItemMigrationProcessor
typeName: Processors
options:
- parameterName: AttachRevisionHistory
  type: Boolean
  description: This will create a json file with the revision history and attach it to the work item. Best used with `MaxRevisions` or `ReplayRevisions`.
  defaultValue: false
  isRequired: false
  dotNetType: System.Boolean, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: Enabled
  type: Boolean
  description: If set to `true` then the processor will run. Set to `false` and the processor will not run.
  defaultValue: false
  isRequired: true
  dotNetType: System.Boolean, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: Enrichers
  type: List
  description: List of Enrichers that can be used to add more features to this processor. Only works with Native Processors and not legacy Processors.
  defaultValue: missing XML code comments
  isRequired: false
  dotNetType: System.Collections.Generic.List`1[[MigrationTools.Enrichers.IProcessorEnricherOptions, MigrationTools, Version=0.0.0.0, Culture=neutral, PublicKeyToken=null]], System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: FilterWorkItemsThatAlreadyExistInTarget
  type: Boolean
  description: >-
    Ignored by the work item migration processor, which logs a warning when it is true (#3270). Work items already in
     the target are no longer skipped: every run checks their migrated revisions against the source, so revisions saved
     with wrong state-stamped values are reported instead of being skipped as migrated.
  defaultValue: false
  isRequired: false
  dotNetType: System.Boolean, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: FixHtmlAttachmentLinks
  type: Boolean
  description: >-
    **beta** If enabled this will fix any image attachments URL's, work item mention URL's or user mentions in the HTML
     fields as well as discussion comments. You must specify a PersonalAccessToken in the Source project for Azure DevOps;
     TFS should use integrated authentication.
  defaultValue: true
  isRequired: false
  dotNetType: System.Boolean, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: GenerateMigrationComment
  type: Boolean
  description: >-
    If enabled, adds a comment recording the migration. The comment is added to the History of the last replayed
     revision, after that revision's own comment, rather than in a separate revision.
  defaultValue: true
  isRequired: false
  dotNetType: System.Boolean, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: GenerateMigrationHyperlink
  type: Boolean
  description: >-
    If enabled, adds a hyperlink with the comment `Migrated from source` from each migrated work item to the web page of
     its source work item, in addition to the reflected work item ID and the migration comment. It never adds a revision:
     on a replay it goes into the last replayed revision, and otherwise into the catch-up save that a later migration run
     makes when it saves the item for another reason (a save made in Azure DevOps does not add it). Re-runs keep exactly one
     such link: if the source URL has changed, the old migration hyperlink is replaced. The exception is decided by location:
     a stale migration hyperlink is kept whenever the source work item has a hyperlink at that same URL, whatever its
     comment, so the target can then have two. If the target already has a hyperlink to the source URL with a different
     comment, it counts as present and is neither duplicated nor changed.
  defaultValue: true
  isRequired: false
  dotNetType: System.Boolean, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: MaxGracefulFailures
  type: Int32
  description: >-
    The maximum number of failed work items to tolerate before the run is aborted. When set to zero (the default) there is no limit: every failed
     work item is logged and recorded, the remaining items are still migrated, and the processor is reported as failed at the end with a list of the
     failed IDs. When set above zero, the run aborts once more than this number of items have failed. Use `StopOnFirstError` to stop on the first failure.
  defaultValue: 0
  isRequired: false
  dotNetType: System.Int32, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: PauseAfterEachWorkItem
  type: Boolean
  description: Pause after each work item is migrated
  defaultValue: false
  isRequired: false
  dotNetType: System.Boolean, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: RefName
  type: String
  description: '`Refname` will be used in the future to allow for using named Options without the need to copy all of the options.'
  defaultValue: missing XML code comments
  isRequired: false
  dotNetType: System.String, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: SkipRevisionWithInvalidAreaPath
  type: Boolean
  description: When set to true, this setting will skip a revision if the source area has not been migrated, has been deleted or is somehow invalid, etc.
  defaultValue: false
  isRequired: false
  dotNetType: System.Boolean, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: SkipRevisionWithInvalidIterationPath
  type: Boolean
  description: This will skip a revision if the source iteration has not been migrated i.e. it was deleted
  defaultValue: false
  isRequired: false
  dotNetType: System.Boolean, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: SourceName
  type: String
  description: This is the `IEndpoint` that will be used as the source of the Migration. Can be null for a write only processor.
  defaultValue: Source
  isRequired: true
  dotNetType: System.String, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: StopOnFirstError
  type: Boolean
  description: >-
    When true, the run stops immediately on the first work item that fails to migrate (the previous default behaviour). When false (the default),
     the failed item is recorded and the remaining items are migrated; the failed IDs are summarised at the end and the process exits non-zero.
  defaultValue: false
  isRequired: false
  dotNetType: System.Boolean, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: TargetName
  type: String
  description: This is the `IEndpoint` that will be used as the Target of the Migration. Can be null for a read only processor.
  defaultValue: Target
  isRequired: true
  dotNetType: System.String, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: WIQLQuery
  type: String
  description: A work item query based on WIQL to select only important work items. To migrate all leave this empty. See [WIQL Query Bits](#wiql-query-bits)
  defaultValue: SELECT [System.Id] FROM WorkItems WHERE [System.TeamProject] = @TeamProject AND [System.WorkItemType] NOT IN ('Test Suite', 'Test Plan','Shared Steps','Shared Parameter','Feedback Request') ORDER BY [System.ChangedDate] desc
  isRequired: true
  dotNetType: System.String, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: WorkItemCreateRetryLimit
  type: Int32
  description: >-
    **beta** If set to a number greater than 0 work items that fail to save will retry after a number of seconds equal to the retry count.
     This allows for periodic network glitches not to end the process.
  defaultValue: 5
  isRequired: false
  dotNetType: System.Int32, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: WorkItemIDs
  type: IList
  description: A list of work items to import
  defaultValue: '[]'
  isRequired: false
  dotNetType: System.Collections.Generic.IList`1[[System.Int32, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e]], System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
status: ready
processingTarget: Work Items
