optionsClassName: FieldMappingToolOptions
optionsClassFullName: MigrationTools.Tools.FieldMappingToolOptions
configurationSamples:
- name: defaults
  order: 2
  description: 
  code: >-
    {
      "MigrationTools": {
        "Version": "16.0",
        "CommonTools": {
          "FieldMappingTool": {
            "Enabled": false,
            "FieldMaps": [],
            "FieldMapDefaults": {
              "ApplyTo": [
                "*"
              ]
            }
          }
        }
      }
    }
  sampleFor: MigrationTools.Tools.FieldMappingToolOptions
- name: sample
  order: 1
  description: 
  code: >-
    {
      "MigrationTools": {
        "Version": "16.0",
        "CommonTools": {
          "FieldMappingTool": {
            "Enabled": true,
            "FieldMaps": [
              {
                "FieldMapType": "FieldCalculationMap",
                "ApplyTo": [
                  "Bug",
                  "Task"
                ],
                "expression": "[effort] * [rate]",
                "parameters": {
                  "effort": "Custom.EstimatedHours",
                  "rate": "Custom.HourlyRate"
                },
                "targetField": "Custom.EstimatedCost"
              },
              {
                "FieldMapType": "FieldMergeMap",
                "ApplyTo": [
                  "SomeWorkItemType"
                ],
                "sourceFields": [
                  "Custom.FieldA",
                  "Custom.FieldB"
                ],
                "targetField": "Custom.FieldC",
                "formatExpression": "{0} \n {1}"
              },
              {
                "FieldMapType": "FieldValueMap",
                "ApplyTo": [
                  "SomeWorkItemType"
                ],
                "sourceField": "System.State",
                "targetField": "System.State",
                "defaultValue": "New",
                "valueMapping": {
                  "Active": "InProgress",
                  "Resolved": "InProgress",
                  "Closed": "Done"
                }
              },
              {
                "FieldMapType": "FieldToFieldMap",
                "ApplyTo": [
                  "SomeWorkItemType"
                ],
                "sourceField": "Microsoft.VSTS.Common.BacklogPriority",
                "targetField": "Microsoft.VSTS.Common.StackRank",
                "defaultValue": 42
              }
            ],
            "FieldMapSamples": {
              "FieldCalculationMap": {
                "FieldMapType": "FieldCalculationMap",
                "ApplyTo": [
                  "Bug",
                  "Task"
                ],
                "expression": "[effort] * [rate]",
                "parameters": {
                  "effort": "Custom.EstimatedHours",
                  "rate": "Custom.HourlyRate"
                },
                "targetField": "Custom.EstimatedCost"
              },
              "FieldClearMap": {
                "ApplyTo": [
                  "SomeWorkItemType"
                ],
                "targetField": "Custom.FieldC"
              },
              "FieldMergeMap": {
                "ApplyTo": [
                  "SomeWorkItemType"
                ],
                "sourceFields": [
                  "Custom.FieldA",
                  "Custom.FieldB"
                ],
                "targetField": "Custom.FieldC",
                "formatExpression": "{0} \n {1}"
              },
              "FieldLiteralMap": {
                "ApplyTo": [
                  "SomeWorkItemType"
                ],
                "targetField": "Custom.SomeField",
                "value": "New field value"
              },
              "MultiValueConditionalMap": {
                "ApplyTo": [
                  "SomeWorkItemType"
                ],
                "sourceFieldsAndValues": {
                  "Field1": "Value1",
                  "Field2": "Value2"
                },
                "targetFieldsAndValues": {
                  "Field1": "Value1",
                  "Field2": "Value2"
                }
              },
              "targetFieldsAndValues": {
                "ApplyTo": [
                  "SomeWorkItemType"
                ],
                "targetField": "Custom.ReflectedWorkItemId"
              },
              "FieldValueMap": {
                "ApplyTo": [
                  "SomeWorkItemType"
                ],
                "sourceField": "System.State",
                "targetField": "System.State",
                "defaultValue": "StateB",
                "valueMapping": {
                  "StateA": "StateB"
                }
              },
              "FieldToFieldMap": {
                "ApplyTo": [
                  "SomeWorkItemType"
                ],
                "sourceField": "Microsoft.VSTS.Common.BacklogPriority",
                "targetField": "Microsoft.VSTS.Common.StackRank",
                "defaultValue": 42
              },
              "FieldToFieldMultiMap": {
                "ApplyTo": [
                  "SomeWorkItemType",
                  "SomeOtherWorkItemType"
                ],
                "SourceToTargetMappings": {
                  "SourceField1": "TargetField1",
                  "SourceField2": "TargetField2"
                }
              },
              "FieldToTagMap": {
                "ApplyTo": [
                  "SomeWorkItemType"
                ],
                "sourceField": "System.State",
                "formatExpression": "ScrumState:{0}"
              },
              "FieldToTagFieldMap": {
                "ApplyTo": [
                  "SomeWorkItemType"
                ],
                "sourceFields": [
                  "System.Description",
                  "Microsoft.VSTS.Common.AcceptanceCriteria"
                ],
                "targetField": "System.Description",
                "formatExpression": "{0} <br/><br/><h3>Acceptance Criteria</h3>{1}"
              },
              "RegexFieldMap": {
                "ApplyTo": [
                  "SomeWorkItemType"
                ],
                "sourceField": "COMPANY.PRODUCT.Release",
                "targetField": "COMPANY.DEVISION.MinorReleaseVersion",
                "pattern": "PRODUCT \\d{4}.(\\d{1})",
                "replacement": "$1"
              },
              "FieldValueToTagMap": {
                "ApplyTo": [
                  "SomeWorkItemType"
                ],
                "sourceField": "Microsoft.VSTS.CMMI.Blocked",
                "pattern": "Yes",
                "formatExpression": "{0}"
              },
              "TreeToTagMap": {
                "ApplyTo": [
                  "SomeWorkItemType"
                ],
                "toSkip": 3,
                "timeTravel": 1
              }
            }
          }
        }
      }
    }
  sampleFor: MigrationTools.Tools.FieldMappingToolOptions
- name: classic
  order: 3
  description: 
  code: >-
    {
      "$type": "FieldMappingToolOptions",
      "Enabled": true,
      "FieldMaps": []
    }
  sampleFor: MigrationTools.Tools.FieldMappingToolOptions
description: Tool for applying field mapping transformations to work items during migration, supporting various field mapping strategies like direct mapping, regex transformations, and value lookups.
className: FieldMappingTool
typeName: Tools
options:
- parameterName: Enabled
  type: Boolean
  description: If set to `true` then the tool will run. Set to `false` and the tool will not run.
  defaultValue: false
  isRequired: false
  dotNetType: System.Boolean, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: FieldMaps
  type: List
  description: Gets or sets the list of field mapping configurations to apply.
  defaultValue: missing XML code comments
