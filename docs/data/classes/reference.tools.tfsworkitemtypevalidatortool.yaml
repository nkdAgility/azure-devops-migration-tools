description: >-
  This tool checks if the work item types in the source system have corresponding types in the target system,
   and validates their fields and mappings.
className: TfsWorkItemTypeValidatorTool
typeName: Tools
options:
- parameterName: Enabled
  type: Boolean
  description: If set to `true` then the tool will run. Set to `false` and the processor will not run.
  defaultValue: true
  isRequired: false
  dotNetType: System.Boolean, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: ExcludeDefaultWorkItemTypes
  type: Boolean
  description: >-
    If `true`, some work item types will be automatically added to `ExcludeWorkItemTypes` list.
     Work item types excluded by default are: Code Review Request, Code Review Response, Feedback Request,
     Feedback Response, Shared Parameter, Shared Steps.
  defaultValue: missing XML code comments
  isRequired: false
  dotNetType: System.Boolean, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: ExcludeSourceFields
  type: Dictionary
  description: >-
    List of fields in source work item types, that are excluded from validation.
     Fields excluded from validation are still validated and all found issues are logged.
     But the result of the validation is 'valid' and the issues are logged as information instead of warning.

     The key is the source work item type name. The value is list of fields' reference names which are excluded.
     You can also use `*` as key to exclude fields from all source work item types.
  defaultValue: Empty dictionary
  isRequired: false
  dotNetType: System.Collections.Generic.Dictionary`2[[System.String, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e],[System.Collections.Generic.List`1[[System.String, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e]], System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e]], System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: ExcludeWorkItemTypes
  type: List
  description: List of work item types which will be excluded from validation.
  defaultValue: missing XML code comments
  isRequired: false
  dotNetType: System.Collections.Generic.List`1[[System.String, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e]], System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: IncludeWorkItemTypes
  type: List
  description: List of work item types which will be validated. If this list is empty, all work item types will be validated.
  defaultValue: null
  isRequired: false
  dotNetType: System.Collections.Generic.List`1[[System.String, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e]], System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: ScanRevisionHistoryForFields
  type: Boolean
  description: >-
    If `true`, before migration starts the work items to be migrated are scanned for fields that
     have a value only in revision history: the revision was saved under another team project or work item type
     (the item was moved or its type changed), and the field is on neither the source type in the current project
     nor the target type the revision is replayed to. These values cannot be migrated, and field maps cannot read
     them. Only moved or retyped revisions are checked, but each one is loaded with a separate server request,
     so the scan can add significant time when many items were moved. It is off by default.
  defaultValue: false
  isRequired: false
  dotNetType: System.Boolean, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: StopIfHistoryOnlyFieldsFound
  type: Boolean
  description: >-
    If `true` and `ScanRevisionHistoryForFields` finds history-only fields that are
     not excluded by `ExcludeSourceFields`, the migration stops before any work item is migrated.
     If `false`, the fields are logged as warnings and the migration continues.
  defaultValue: false
  isRequired: false
  dotNetType: System.Boolean, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
