optionsClassName: TagMappingMapOptions
optionsClassFullName: MigrationTools.Tools.TagMappingMapOptions
configurationSamples:
- name: defaults
  order: 2
  description: 
  code: >-
    {
      "MigrationTools": {
        "Version": "16.0",
        "CommonTools": {
          "FieldMappingTool": {
            "FieldMaps": [
              {
                "FieldMapType": "TagMappingMap",
                "ApplyTo": [
                  "*"
                ]
              }
            ]
          }
        }
      }
    }
  sampleFor: MigrationTools.Tools.TagMappingMapOptions
- name: sample
  order: 1
  description: 
  code: >-
    {
      "MigrationTools": {
        "Version": "16.0",
        "CommonTools": {
          "FieldMappingTool": {
            "FieldMaps": [
              {
                "FieldMapType": "TagMappingMap",
                "ApplyTo": [
                  "SomeWorkItemType"
                ],
                "mappings": [
                  {
                    "source": "Bug-Bash",
                    "target": "BugBash"
                  },
                  {
                    "source": "regex:^v1\\..*$",
                    "target": "Legacy"
                  }
                ]
              }
            ]
          }
        }
      }
    }
  sampleFor: MigrationTools.Tools.TagMappingMapOptions
- name: classic
  order: 3
  description: 
  code: >-
    {
      "$type": "TagMappingMapOptions",
      "mappings": [
        {
          "source": "Bug-Bash",
          "target": "BugBash"
        },
        {
          "source": "regex:^v1\\..*$",
          "target": "Legacy"
        }
      ],
      "ApplyTo": [
        "*",
        "SomeWorkItemType"
      ]
    }
  sampleFor: MigrationTools.Tools.TagMappingMapOptions
description: Renames tags on the target work item from a list of source → target pairs; tags that match no pair are kept unchanged.
className: TagMappingMap
typeName: FieldMaps
options:
- parameterName: ApplyTo
  type: List
  description: A list of Work Item Types that this Field Map will apply to. Use "*" to apply it to all Work Item Types. A field map with an empty list applies to no Work Item Types and never runs.
  defaultValue: missing XML code comments
  isRequired: false
  dotNetType: System.Collections.Generic.List`1[[System.String, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e]], System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: Enabled
  type: Boolean
  description: 'Not used: every configured field map runs for the work item types in `ApplyTo`. To turn a field map off, remove it from `FieldMaps`.'
  defaultValue: missing XML code comments
  isRequired: false
  dotNetType: System.Boolean, System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
- parameterName: mappings
  type: List
  description: The renames, applied in order; the first `source` that matches a tag wins.
  defaultValue: '[]'
  isRequired: false
  dotNetType: System.Collections.Generic.List`1[[MigrationTools.Tools.TagMapping, MigrationTools, Version=0.0.0.0, Culture=neutral, PublicKeyToken=null]], System.Private.CoreLib, Version=8.0.0.0, Culture=neutral, PublicKeyToken=7cec85d7bea7798e
